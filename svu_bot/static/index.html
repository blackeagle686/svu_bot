<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVU Bot - Virtual Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo">
                <span class="icon">🚀</span>
                <h1>SVU Bot</h1>
            </div>
            <div class="status-badge">
                <span class="dot"></span> Online
            </div>
        </header>

        <main id="chat-window">
            <div class="message bot-message">
                <div class="message-content">
                    Hello! I'm your SVU Virtual Assistant. How can I help you today?
                    <br><br>
                    Feel free to ask questions or <b>attach a document</b> for me to analyze.
                </div>
            </div>
        </main>

        <footer>
            <div class="input-wrapper">
                <div id="attachment-preview" class="attachment-preview">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><polyline points="13 2 13 9 20 9"></polyline></svg>
                    <span id="file-name"></span>
                    <button id="remove-file" style="background:none; border:none; color: #ef4444; cursor:pointer; padding: 0 4px;">&times;</button>
                </div>
                <form id="chat-form">
                    <div class="input-container">
                        <input type="file" id="file-input" style="display: none;">
                        <button type="button" id="attach-btn" class="attach-btn">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                        </button>
                        <input type="text" id="user-input" placeholder="Ask SVU Bot..." autocomplete="off">
                    </div>
                    <button type="submit" id="send-btn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </form>
            </div>
        </footer>
    </div>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const fileInput = document.getElementById('file-input');
        const attachBtn = document.getElementById('attach-btn');
        const attachmentPreview = document.getElementById('attachment-preview');
        const fileNameSpan = document.getElementById('file-name');
        const removeFileBtn = document.getElementById('remove-file');

        let selectedFile = null;

        attachBtn.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            selectedFile = e.target.files[0];
            if (selectedFile) {
                fileNameSpan.textContent = selectedFile.name;
                attachmentPreview.style.display = 'flex';
            }
        });

        removeFileBtn.addEventListener('click', () => {
            selectedFile = null;
            fileInput.value = '';
            attachmentPreview.style.display = 'none';
        });

        function addMessage(content, role, isHTML = false) {
            const div = document.createElement('div');
            div.className = `message ${role}-message`;
            
            const inner = document.createElement('div');
            inner.className = 'message-content';
            if (isHTML) inner.innerHTML = content;
            else inner.textContent = content;
            
            div.appendChild(inner);
            chatWindow.appendChild(div);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function addTypingIndicator() {
            const div = document.createElement('div');
            div.className = 'message bot-message loading';
            div.id = 'typing-indicator';
            div.innerHTML = `
                <div class="message-content">
                    <div class="typing-indicator">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            `;
            chatWindow.appendChild(div);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = userInput.value.trim();
            if (!msg && !selectedFile) return;

            // Add user message
            if (msg) addMessage(msg, 'user');
            else if (selectedFile) addMessage(`Uploaded file: ${selectedFile.name}`, 'user');

            userInput.value = '';
            const formData = new FormData();
            formData.append('message', msg || `Analyzing file: ${selectedFile ? selectedFile.name : ''}`);
            if (selectedFile) {
                formData.append('file', selectedFile);
            }

            // Reset selection
            selectedFile = null;
            fileInput.value = '';
            attachmentPreview.style.display = 'none';

            addTypingIndicator();

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    body: formData // Fetch handles Content-Type automatically for FormData
                });
                const data = await response.json();
                
                document.getElementById('typing-indicator')?.remove();
                addMessage(data.reply, 'bot');
            } catch (err) {
                document.getElementById('typing-indicator')?.remove();
                addMessage('Sorry, I encountered an error processing your request.', 'bot');
            }
        });
    </script>
</body>
</html>
